name: Plugin contracts
on:
  push:
    paths: ['VisualPinball.Plugins/**', 'VisualPinball.Plugins.Test/**', '.github/workflows/plugins.yml']
  pull_request:
    paths: ['VisualPinball.Plugins/**', 'VisualPinball.Plugins.Test/**', '.github/workflows/plugins.yml']
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test VisualPinball.Plugins.Test/VisualPinball.Plugins.Test.csproj -c Release
